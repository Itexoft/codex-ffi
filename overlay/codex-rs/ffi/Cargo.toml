[package]
name = "codex-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "codex_ffi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]
doctest = false

# Membership in the Codex workspace is deliberate: it binds this crate to the
# dependency graph Codex itself locks and tests, including the forked websocket
# crates pinned in [patch.crates-io].
[dependencies]
codex-api = { workspace = true }
codex-client = { workspace = true }
codex-config = { workspace = true }
codex-http-client = { workspace = true }
codex-login = { workspace = true }
codex-model-provider = { workspace = true }
codex-model-provider-info = { workspace = true }
http = { workspace = true }
# Cargo unifies features across the graph, so asking for `socks` here is what
# lets every Codex client accept socks5:// and socks5h:// proxy URLs.
reqwest = { workspace = true, features = ["socks"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
